<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#f7fdf9"/>
<text x="800" y="60" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#14532d" text-anchor="middle">Espinha de peixe: genética (fenótipo)</text>
<line x1="90" y1="520" x2="1240" y2="520" stroke="#16a34a" stroke-width="8"/>
<rect x="1250" y="430" width="300" height="180" rx="24" fill="#16a34a"/>
<text x="1400" y="490" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Fenótipo</text><text x="1400" y="527.5" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">a característica</text><text x="1400" y="565" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">que aparece</text>
<line x1="180" y1="330" x2="390" y2="520" stroke="#16a34a" stroke-width="6"/><rect x="155" y="150" width="350" height="180" rx="22" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="330" y="192" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f1b2e" text-anchor="middle">Alelos e genótipo</text><text x="330" y="230" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Cada gene tem dois alelos</text><text x="330" y="257" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">AA, Aa ou aa</text><text x="330" y="284" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Genótipo é a combinação</text>
<line x1="550" y1="330" x2="760" y2="520" stroke="#16a34a" stroke-width="6"/><rect x="525" y="150" width="350" height="180" rx="22" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="700" y="192" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f1b2e" text-anchor="middle">Dominância</text><text x="700" y="230" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">A (maiúscula) é dominante</text><text x="700" y="257" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">a (minúscula) é recessivo</text><text x="700" y="284" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Aa mostra o dominante</text>
<line x1="920" y1="330" x2="1130" y2="520" stroke="#16a34a" stroke-width="6"/><rect x="895" y="150" width="350" height="180" rx="22" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="1070" y="192" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f1b2e" text-anchor="middle">Leis de Mendel</text><text x="1070" y="230" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">1ª: os alelos se separam</text><text x="1070" y="257" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">nos gametas</text><text x="1070" y="284" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">2ª: características independentes</text>
<line x1="180" y1="710" x2="390" y2="520" stroke="#16a34a" stroke-width="6"/><rect x="155" y="700" width="350" height="180" rx="22" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="330" y="742" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f1b2e" text-anchor="middle">Tipo de cruzamento</text><text x="330" y="780" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Aa × Aa: 3 : 1 no fenótipo</text><text x="330" y="807" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Aa × aa: 1 : 1</text><text x="330" y="834" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Use o quadro de Punnett</text>
<line x1="550" y1="710" x2="760" y2="520" stroke="#16a34a" stroke-width="6"/><rect x="525" y="700" width="350" height="180" rx="22" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="700" y="742" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f1b2e" text-anchor="middle">Ambiente</text><text x="700" y="780" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Alimentação e clima mudam</text><text x="700" y="807" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">a expressão de alguns genes</text><text x="700" y="834" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Ex.: altura, cor da pele</text>
<line x1="920" y1="710" x2="1130" y2="520" stroke="#16a34a" stroke-width="6"/><rect x="895" y="700" width="350" height="180" rx="22" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="1070" y="742" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f1b2e" text-anchor="middle">Heredogramas</text><text x="1070" y="780" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Quadrados: homens</text><text x="1070" y="807" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Círculos: mulheres</text><text x="1070" y="834" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Preenchido: afetado</text>
<text x="800" y="960" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#4b5f53" text-anchor="middle">Nexa · Biologia, 2ª série EM</text>
</svg>