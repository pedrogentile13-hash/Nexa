<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#faf8ff"/>
<text x="800" y="60" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#4c1d95" text-anchor="middle">Mapa mental: modos verbais</text>
<g stroke="#7c3aed" stroke-width="5" fill="none">
  <path d="M800 500 C 620 500, 560 300, 520 260"/>
  <path d="M800 500 C 980 500, 1040 300, 1080 260"/>
  <path d="M800 500 C 620 500, 560 700, 520 740"/>
  <path d="M800 500 C 980 500, 1040 700, 1080 740"/>
</g>
<ellipse cx="800" cy="500" rx="150" ry="75" fill="#7c3aed"/>
<text x="800" y="492" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">Modos</text><text x="800" y="529.4" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">verbais</text>
<rect x="70" y="150" width="480" height="220" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="310" y="192" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f1b2e" text-anchor="middle">Indicativo</text><text x="310" y="230" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Apresenta fato, certeza ou ação habitual.</text><text x="310" y="257" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Ex.: "Eles apresentarão os trabalhos."</text><text x="310" y="284" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Tempos: presente, pretérito, futuro</text>
<rect x="1050" y="150" width="480" height="220" rx="22" fill="#fce7f3" stroke="#db2777" stroke-width="3"/><text x="1290" y="192" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f1b2e" text-anchor="middle">Subjuntivo</text><text x="1290" y="230" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Apresenta desejo, dúvida ou hipótese.</text><text x="1290" y="257" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Ex.: "Espero que você compreenda."</text><text x="1290" y="284" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Costuma vir depois de que, se, talvez</text>
<rect x="70" y="630" width="480" height="220" rx="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="310" y="672" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f1b2e" text-anchor="middle">Imperativo</text><text x="310" y="710" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Dá ordem, pedido, conselho ou orientação.</text><text x="310" y="737" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Ex.: "Feche a porta, por favor."</text><text x="310" y="764" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Afirmativo e negativo</text>
<rect x="1050" y="630" width="480" height="220" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1290" y="672" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f1b2e" text-anchor="middle">Formas nominais</text><text x="1290" y="710" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Não variam em pessoa nem em tempo.</text><text x="1290" y="737" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Infinitivo: estudar</text><text x="1290" y="764" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Gerúndio: estudando</text><text x="1290" y="791" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#353047" text-anchor="middle">Particípio: estudado</text>
<text x="800" y="960" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#6b6780" text-anchor="middle">Nexa · Português, 4º bimestre</text>
</svg>